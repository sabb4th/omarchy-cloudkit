# Development settings for the retained Python reference and regression tests.
# Runtime implementation and CLI are Rust.
#   uv tool install ruff ty
#   ruff format && ruff check && ty check

[tool.ruff]
# 0.16 enabled the broader default rule set the code is checked against
required-version = ">=0.16"
target-version = "py310"

[tool.ty.environment]
python-version = "3.10"
# Reference tests and the screenshot renderer import guac from lib/
extra-paths = ["lib"]

[tool.ty.src]
include = ["lib", "tests", "docs"]
